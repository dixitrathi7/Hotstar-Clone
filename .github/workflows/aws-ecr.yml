# This workflow will build and push a new container image to Amazon ECR
name: Push to Amazon ECR

on:
  push:
    branches: [ "argocd" ]

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: argo-hotstar
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.ARGO_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.ARGO_AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build a docker container and
        # push it to ECR so that it can
        # be deployed to ECS.
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Update GitOps repository
      shell: bash
      env:
        GIT_TOKEN: ${{ secrets.GITOPS_PAT }}
      run: |
        # Configure git credential store
        git config --global credential.helper store
        echo "https://${GIT_TOKEN}:x-oauth-basic@github.com" > ~/.git-credentials

        # Remove any existing gitops directory
        rm -rf gitops

        # Clone repository
        git clone https://github.com/dixitrathi7/GitOps_K8s_manifest.git gitops
        cd gitops/hotstar_clone_manifest

        # Update image tag
        sed -i "s|image: .*|image: $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}|g" deployment.yml

        # Commit changes
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

        git add deployment.yml

        git commit -m "Update image to ${{ github.sha }}" || echo "No changes to commit"

        # Push changes
        git push https://${GIT_TOKEN}@github.com/dixitrathi7/GitOps_K8s_manifest.git HEAD:main
